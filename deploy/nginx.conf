# /etc/nginx/conf.d/chat.conf
#
# 反向代理：把 8080 收进来的 HTTP / WebSocket 转给本机 127.0.0.1:3000 的 uvicorn。
# 默认监听 8080 而非 80 —— 国内云主机未备案时 80/443 会被拦截，8080 不受影响。
# 等域名备案完成后，把 listen 改成 80 并补上 443 的 SSL 配置即可。

# WebSocket 协议升级：有 Upgrade 头就转发 "upgrade"，没有就 "close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;                 # 隐藏 nginx 版本号
    client_max_body_size 64k;          # 本项目没有上传功能，收紧一点

    # ---------- 安全响应头 ----------
    # 暂不加 CSP：页面是单文件内联脚本，加 CSP 必须开 'unsafe-inline'，等于没防。
    # 后续把 JS 拆成独立文件后，再回来加 CSP。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/chat.access.log;
    error_log  /var/log/nginx/chat.error.log warn;

    # ---------- WebSocket ----------
    # proxy_read_timeout 必须 > 客户端心跳间隔(25s)，否则空闲连接会被 nginx 掐断。
    # proxy_buffering off 也是必须的，否则消息会被缓冲攒着不发。
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # ---------- 页面 / 健康检查 ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
